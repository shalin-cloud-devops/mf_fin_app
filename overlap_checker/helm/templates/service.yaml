apiVersion: v1
kind: Service
metadata:
    name: {{ .Values.service.svc_name }}
    labels: {{- toYaml .Values.deployment.labels | nindent 6 }}

spec:
    type: {{ .Values.service.type }}
    ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    selector:
      app: {{ .Values.deployment.labels.app }}