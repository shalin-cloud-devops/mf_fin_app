apiVersion: batch/v1
kind: Job

metadata:
  name: fund-fetcher

spec:
  template:
    spec:
      containers:
        - name: fund-fetcher
          image: fund-fetcher:0.1
          imagePullPolicy: IfNotPresent

          env:
            - name: KAFKA_BROKER
              value: "kafka-svc:9092"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

      restartPolicy: Never
