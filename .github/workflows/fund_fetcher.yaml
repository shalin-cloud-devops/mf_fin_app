name: "Build for the Fund fetcher svc"

on:
    push:
        paths:
            - "fund_fetcher/**"
    pull_request:
        branches:
            - main
            - release*
        paths:
            - "fund_fetcher/**"
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    pull-requests: write

jobs:
    fund-fetcher-build:
        name: "Build fund-fetcher-svc"
        runs-on: ubuntu-latest

        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        defaults:
            run:
                working-directory: ./fund_fetcher

        steps:
            - name: "Checkout Code"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: "SonarQube Scan"
              uses: sonarsource/sonarqube-scan-action@v6
              with:
                  args: >
                      -Dsonar.organization=shalin-cloud-devops
                      -Dsonar.projectKey=shalin-cloud-devops_fund_fetcher
                      -Dsonar.sources=fund_fetcher
                      -Dsonar.exclusions=**/deployment.yaml
                      -Dsonar.qualitygate.wait=true

            - name: "Install Python"
              uses: actions/setup-python@v5
              with:
                  python-version: 3.12

            - name: "Install Dependecies - fund_fetcher"
              run: pip install -r requirements.txt

            - name: "Set up Snyk CLI"
              uses: snyk/actions/setup@master

            - name: "Snyk Monitor (Upload to Snyk UI)"
              run: snyk monitor --file=requirements.txt

            - name: "Snyk Dependency Scan"
              run: snyk test --severity-threshold=high --file=requirements.txt
