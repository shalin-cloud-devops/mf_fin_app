name: "Build for the Fund fetcher svc"

on:
    push:
        paths:
            - "fund_fetcher/**"
    pull_request:
        branches:
            - main
            - release*
        paths:
            - "fund_fetcher/**"
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    pull-requests: write

jobs:
    fund-fetcher-build:
        name: "Build fund-fetcher-svc"
        runs-on: ubuntu-latest

        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        defaults:
            run:
                working-directory: ./fund_fetcher

        steps:
            - name: "Checkout Code"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: "SonarQube Scan"
              uses: sonarsource/sonarqube-scan-action@v6
              with:
                  args: >
                      -Dsonar.organization=shalin-cloud-devops
                      -Dsonar.projectKey=shalin-cloud-devops_fund_fetcher
                      -Dsonar.sources=fund_fetcher
                      -Dsonar.exclusions=**/deployment.yaml
                      -Dsonar.qualitygate.wait=true

            - name: "Install Python"
              uses: actions/setup-python@v5
              with:
                  python-version: 3.12

            - name: "Install Dependecies - fund_fetcher"
              run: pip install -r requirements.txt

            - name: "Set up Snyk CLI"
              uses: snyk/actions/setup@master

            - name: "Snyk Dependency Scan"
              run: snyk test --severity-threshold=high --file=requirements.txt

            - name: "Docker setup - fund_fetcher"
              uses: docker/setup-buildx-action@v3

            - name: "Docker build - fund_fetcher"
              uses: docker/build-push-action@v6
              with:
                  context: ./fund_fetcher
                  file: ./fund_fetcher/Dockerfile
                  push: false
                  load: true
                  tags: 514005485562.dkr.ecr.us-east-1.amazonaws.com/fund-fetcher:1.0.0

            - name: "Trivy Vulnerability Scanner"
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "514005485562.dkr.ecr.us-east-1.amazonaws.com/fund-fetcher:1.0.0"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
